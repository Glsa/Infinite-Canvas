<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/images/logo.png" type="image/png">
    <title>登录 - AI Studio</title>
    <style>
        html.studio-route-booting body { visibility: hidden !important; }
    </style>
    <script>
        (function(){
            try {
                var theme = localStorage.getItem('studio_theme') || localStorage.getItem('canvas_theme') || 'light';
                if(theme === 'dark') {
                    document.documentElement.classList.add('studio-theme-dark');
                    document.documentElement.classList.add('theme-dark');
                }
                document.documentElement.classList.add('studio-route-booting');
            } catch(e) {}
        })();
    </script>
    <script src="/static/vendor/js/tailwindcss-cdn.js?v=2026.06.03.1"></script>
    <script src="/static/vendor/js/lucide.js?v=2026.06.03.1"></script>
    <script src="/static/js/theme.js?v=2026.06.03.1"></script>
    <link rel="stylesheet" href="/static/css/theme.css?v=2026.06.03.1">
    <style>
        @import url('/static/vendor/css/fonts.css?v=2026.06.03.1');

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --ease: cubic-bezier(.4, 0, .2, 1);
            --bg: #ffffff;
            --text: #121212;
            --muted: #999;
            --border: #f2f2f2;
            --card-bg: #ffffff;
            --card-border: #f2f2f2;
            --input-bg: #fafafa;
            --input-border: #eef2f7;
            --input-focus-border: #d8dee9;
            --btn-bg: #121212;
            --btn-text: #ffffff;
            --btn-hover-bg: #333;
            --tab-bg: #f8fafc;
            --tab-border: #edf2f7;
            --tab-active-bg: #ffffff;
            --tab-active-text: #111827;
            --tab-inactive-text: #94a3b8;
            --error-color: #ef4444;
        }

        html.studio-theme-dark, html.studio-theme-dark body {
            --bg: #08090c;
            --text: #e8e8ea;
            --muted: #657286;
            --border: #25262b;
            --card-bg: #111216;
            --card-border: #25262b;
            --input-bg: #0c0d10;
            --input-border: #32343a;
            --input-focus-border: #566174;
            --btn-bg: #e8e8ea;
            --btn-text: #08090c;
            --btn-hover-bg: #d0d0d4;
            --tab-bg: #0c0d10;
            --tab-border: #25262b;
            --tab-active-bg: #e8e8ea;
            --tab-active-text: #08090c;
            --tab-inactive-text: #8f9aab;
            --error-color: #f87171;
        }

        body {
            font-family: 'Space Grotesk', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transition: background .3s var(--ease), color .3s var(--ease);
        }

        /* Theme toggle */
        .theme-toggle {
            position: fixed;
            top: 24px;
            right: 24px;
            width: 40px;
            height: 40px;
            border-radius: 999px;
            border: 1px solid var(--tab-border);
            background: var(--card-bg);
            color: var(--muted);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all .2s var(--ease);
            z-index: 10;
        }
        .theme-toggle:hover {
            background: var(--tab-bg);
            color: var(--text);
            border-color: var(--input-focus-border);
        }

        /* Card */
        .login-card {
            width: min(420px, calc(100vw - 48px));
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px 36px 36px;
            box-shadow: 0 1px 0 rgba(0,0,0,.03);
            transition: background .3s var(--ease), border-color .3s var(--ease), box-shadow .3s var(--ease);
        }

        /* Logo */
        .logo-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            margin-bottom: 32px;
        }
        .logo-ring {
            width: 36px;
            height: 36px;
            border: 2px solid var(--text);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color .3s var(--ease), border-radius .3s var(--ease);
        }
        .logo-dot {
            width: 6px;
            height: 6px;
            border-radius: 999px;
            background: var(--text);
            transition: background .3s var(--ease);
        }
        .logo-title {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: .02em;
            color: var(--text);
            transition: color .3s var(--ease);
        }

        /* Tab toggle */
        .tab-switch {
            background: var(--tab-bg);
            border: 1px solid var(--tab-border);
            border-radius: 999px;
            padding: 3px;
            display: flex;
            gap: 2px;
            margin-bottom: 28px;
            transition: background .3s var(--ease), border-color .3s var(--ease);
        }
        .tab-btn {
            flex: 1;
            height: 36px;
            border-radius: 999px;
            border: none;
            background: transparent;
            color: var(--tab-inactive-text);
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all .2s var(--ease);
        }
        .tab-btn.active {
            background: var(--tab-active-bg);
            color: var(--tab-active-text);
            box-shadow: 0 1px 3px rgba(15,23,42,.08);
        }

        /* Form */
        .form-panel { display: none; }
        .form-panel.active { display: block; }

        .field {
            margin-bottom: 16px;
        }
        .field-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 6px;
            letter-spacing: .02em;
            transition: color .3s var(--ease);
        }
        .field-input {
            width: 100%;
            height: 44px;
            padding: 0 16px;
            border: 1px solid var(--input-border);
            border-radius: 14px;
            background: var(--input-bg);
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color .2s var(--ease), background .2s var(--ease), box-shadow .2s var(--ease);
        }
        .field-input::placeholder {
            color: var(--muted);
        }
        .field-input:focus {
            border-color: var(--input-focus-border);
            box-shadow: 0 0 0 3px rgba(148,163,184,.10);
        }

        /* Submit button */
        .submit-btn {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 18px;
            background: var(--btn-bg);
            color: var(--btn-text);
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all .2s var(--ease);
            margin-top: 8px;
        }
        .submit-btn:hover {
            background: var(--btn-hover-bg);
        }
        .submit-btn:active {
            transform: scale(.98);
        }
        .submit-btn:disabled {
            opacity: .5;
            cursor: not-allowed;
            transform: none;
        }

        /* Error */
        .form-error {
            text-align: center;
            font-size: 13px;
            color: var(--error-color);
            min-height: 20px;
            margin-top: 12px;
            line-height: 1.4;
            transition: color .3s var(--ease);
        }
    </style>
</head>
<body>
    <!-- Theme toggle -->
    <button class="theme-toggle" type="button" onclick="toggleTheme()" id="themeToggle" title="切换主题">
        <svg id="iconMoon" width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <svg id="iconSun" width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
    </button>

    <div class="login-card">
        <!-- Logo -->
        <div class="logo-area">
            <div class="logo-ring">
                <div class="logo-dot"></div>
            </div>
            <div class="logo-title">AI Studio</div>
        </div>

        <!-- Tab switch -->
        <div class="tab-switch">
            <button class="tab-btn active" type="button" data-tab="login" onclick="switchTab('login')">登录</button>
            <button class="tab-btn" type="button" data-tab="register" onclick="switchTab('register')">注册</button>
        </div>

        <!-- Login form -->
        <form class="form-panel active" id="loginForm" onsubmit="handleLogin(event)">
            <div class="field">
                <label class="field-label" for="loginInput">用户名 / 邮箱</label>
                <input class="field-input" type="text" id="loginInput" name="login" placeholder="请输入用户名或邮箱" autocomplete="username" required>
            </div>
            <div class="field">
                <label class="field-label" for="loginPassword">密码</label>
                <input class="field-input" type="password" id="loginPassword" name="password" placeholder="请输入密码" autocomplete="current-password" required>
            </div>
            <button class="submit-btn" type="submit" id="loginBtn">登录</button>
            <div class="form-error" id="loginError"></div>
        </form>

        <!-- Register form -->
        <form class="form-panel" id="registerForm" onsubmit="handleRegister(event)">
            <div class="field">
                <label class="field-label" for="regUsername">用户名</label>
                <input class="field-input" type="text" id="regUsername" name="username" placeholder="请输入用户名" autocomplete="username" required>
            </div>
            <div class="field">
                <label class="field-label" for="regEmail">邮箱</label>
                <input class="field-input" type="email" id="regEmail" name="email" placeholder="请输入邮箱地址" autocomplete="email" required>
            </div>
            <div class="field">
                <label class="field-label" for="regPassword">密码</label>
                <input class="field-input" type="password" id="regPassword" name="password" placeholder="请输入密码" autocomplete="new-password" required minlength="6">
            </div>
            <div class="field">
                <label class="field-label" for="regConfirm">确认密码</label>
                <input class="field-input" type="password" id="regConfirm" name="confirm" placeholder="请再次输入密码" autocomplete="new-password" required>
            </div>
            <button class="submit-btn" type="submit" id="registerBtn">注册</button>
            <div class="form-error" id="registerError"></div>
        </form>
    </div>

    <script>
        /* ---- Tab Switch ---- */
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(function(btn) {
                btn.classList.toggle('active', btn.dataset.tab === tab);
            });
            document.querySelectorAll('.form-panel').forEach(function(panel) {
                panel.classList.toggle('active', panel.id === tab + 'Form');
            });
            clearErrors();
        }

        function clearErrors() {
            document.getElementById('loginError').textContent = '';
            document.getElementById('registerError').textContent = '';
        }

        /* ---- Theme ---- */
        function toggleTheme() {
            var current = window.StudioTheme ? window.StudioTheme.get() : 'light';
            var next = current === 'dark' ? 'light' : 'dark';
            if (window.StudioTheme) {
                window.StudioTheme.set(next);
            } else {
                try {
                    localStorage.setItem('studio_theme', next);
                    document.documentElement.classList.toggle('studio-theme-dark', next === 'dark');
                    document.documentElement.classList.toggle('theme-dark', next === 'dark');
                    if (document.body) {
                        document.body.classList.toggle('studio-theme-dark', next === 'dark');
                        document.body.classList.toggle('theme-dark', next === 'dark');
                    }
                } catch (e) {}
            }
            updateThemeIcon(next);
        }

        function updateThemeIcon(theme) {
            var moon = document.getElementById('iconMoon');
            var sun = document.getElementById('iconSun');
            if (theme === 'dark') {
                moon.style.display = 'none';
                sun.style.display = 'block';
            } else {
                moon.style.display = 'block';
                sun.style.display = 'none';
            }
        }

        /* ---- Init theme icon ---- */
        (function() {
            var t = 'light';
            try { t = localStorage.getItem('studio_theme') || localStorage.getItem('canvas_theme') || 'light'; } catch(e) {}
            updateThemeIcon(t);
            document.documentElement.classList.remove('studio-route-booting');
        })();

        /* ---- Helpers ---- */
        function setLoading(btnId, loading) {
            var btn = document.getElementById(btnId);
            btn.disabled = loading;
            if (loading) {
                btn._origText = btn.textContent;
                btn.textContent = '处理中...';
            } else {
                btn.textContent = btn._origText || btn.textContent;
            }
        }

        function showError(id, msg) {
            document.getElementById(id).textContent = msg;
        }

        /* ---- Login ---- */
        function handleLogin(e) {
            e.preventDefault();
            clearErrors();

            var login = document.getElementById('loginInput').value.trim();
            var password = document.getElementById('loginPassword').value;

            if (!login || !password) {
                showError('loginError', '请填写用户名和密码');
                return;
            }

            setLoading('loginBtn', true);

            fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ login: login, password: password })
            })
            .then(function(res) {
                return res.json().then(function(data) {
                    if (!res.ok) throw new Error(data.message || data.error || '登录失败');
                    return data;
                });
            })
            .then(function(data) {
                if (data.token) {
                    try { localStorage.setItem('studio_token', data.token); } catch(e) {}
                }
                window.location.href = '/';
            })
            .catch(function(err) {
                showError('loginError', err.message || '登录失败，请重试');
            })
            .finally(function() {
                setLoading('loginBtn', false);
            });
        }

        /* ---- Register ---- */
        function handleRegister(e) {
            e.preventDefault();
            clearErrors();

            var username = document.getElementById('regUsername').value.trim();
            var email = document.getElementById('regEmail').value.trim();
            var password = document.getElementById('regPassword').value;
            var confirm = document.getElementById('regConfirm').value;

            if (!username || !email || !password || !confirm) {
                showError('registerError', '请填写所有字段');
                return;
            }
            if (password.length < 6) {
                showError('registerError', '密码长度至少 6 位');
                return;
            }
            if (password !== confirm) {
                showError('registerError', '两次输入的密码不一致');
                return;
            }

            setLoading('registerBtn', true);

            fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: username, email: email, password: password })
            })
            .then(function(res) {
                return res.json().then(function(data) {
                    if (!res.ok) throw new Error(data.message || data.error || '注册失败');
                    return data;
                });
            })
            .then(function(data) {
                /* Auto-login after successful registration */
                if (data.token) {
                    try { localStorage.setItem('studio_token', data.token); } catch(e) {}
                    window.location.href = '/';
                } else {
                    /* No token returned, try login with credentials */
                    return fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ login: username, password: password })
                    })
                    .then(function(loginRes) {
                        return loginRes.json().then(function(loginData) {
                            if (loginData.token) {
                                try { localStorage.setItem('studio_token', loginData.token); } catch(e) {}
                            }
                            window.location.href = '/';
                        });
                    });
                }
            })
            .catch(function(err) {
                showError('registerError', err.message || '注册失败，请重试');
            })
            .finally(function() {
                setLoading('registerBtn', false);
            });
        }
    </script>
</body>
</html>
